name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Catch breakage caused by changes on the HACS / hassfest side, not ours.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Must pass with no errors and no entries in `ignore`, otherwise the
      # hacs/default submission is rejected.
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
